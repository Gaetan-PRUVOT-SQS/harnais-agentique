[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["archives", "skills-archive", "statusline", "skills"]
extend-include = ["verifier"]

[tool.ruff.lint.per-file-ignores]
"hooks/dispatch.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
